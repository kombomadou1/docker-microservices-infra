---
- name: Deployer Mattermost
  hosts: docker_hosts
  become: true

  vars:
    service_project_path: /opt/docker_services/mattermost

  tasks:
    - name: Creer le dossier projet Mattermost sur la VM
      ansible.builtin.file:
        path: "{{ service_project_path }}"
        state: directory
        mode: "0755"

    - name: Copier le docker-compose Mattermost par defaut sur la VM
      ansible.builtin.copy:
        src: ./mattermost/docker-compose.yml
        dest: "{{ service_project_path }}/docker-compose.yml"
        mode: "0644"

    - name: Copier la config nginx Mattermost (si necessaire)
      ansible.builtin.copy:
        src: ./mattermost/nginx/
        dest: "{{ service_project_path }}/nginx/"
        mode: "0644"
      ignore_errors: true

    - name: Deployer Mattermost avec Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: "{{ service_project_path }}"
        state: present
