---
- name: Deployer Nextcloud
  hosts: docker_hosts
  become: true

  vars:
    service_project_path: /opt/docker_services/nextcloud

  tasks:
    - name: Creer le dossier projet Nextcloud sur la VM
      ansible.builtin.file:
        path: "{{ service_project_path }}"
        state: directory
        mode: "0755"

    - name: Copier le docker-compose Nextcloud sur la VM
      ansible.builtin.copy:
        src: ./nextcloud/docker-compose.yml
        dest: "{{ service_project_path }}/docker-compose.yml"
        mode: "0644"

    - name: Deployer Nextcloud avec Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: "{{ service_project_path }}"
        state: present
