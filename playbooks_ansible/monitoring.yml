---
- name: Deployer le stack Monitoring
  hosts: docker_hosts
  become: true

  vars:
    service_project_path: /opt/docker_services/monitoring

  tasks:
    - name: Creer le dossier projet Monitoring sur la VM
      ansible.builtin.file:
        path: "{{ service_project_path }}"
        state: directory
        mode: "0755"

    - name: Copier le docker-compose Monitoring sur la VM
      ansible.builtin.copy:
        src: ./monitoring/docker-compose.yml
        dest: "{{ service_project_path }}/docker-compose.yml"
        mode: "0644"

    - name: Copier la configuration Prometheus
      ansible.builtin.copy:
        src: ./monitoring/prometheus/
        dest: "{{ service_project_path }}/prometheus/"
        mode: "0644"
      ignore_errors: true

    - name: Deployer Monitoring avec Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: "{{ service_project_path }}"
        state: present
