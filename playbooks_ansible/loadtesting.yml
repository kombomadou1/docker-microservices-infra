---
- name: Deployer Loadtesting (k6)
  hosts: docker_hosts
  become: true

  vars:
    service_project_path: /opt/docker_services/loadtesting

  tasks:
    - name: Creer le dossier projet Loadtesting sur la VM
      ansible.builtin.file:
        path: "{{ service_project_path }}"
        state: directory
        mode: "0755"

    - name: Copier le docker-compose Loadtesting sur la VM
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../loadtesting/docker-compose.yml"
        dest: "{{ service_project_path }}/docker-compose.yml"
        mode: "0644"

    - name: Copier les scripts k6
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../loadtesting/k6/"
        dest: "{{ service_project_path }}/k6/"
        mode: "0644"
      ignore_errors: true

    - name: Deployer Loadtesting avec Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: "{{ service_project_path }}"
        state: present
