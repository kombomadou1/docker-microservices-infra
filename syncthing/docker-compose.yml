services:
  syncthing:
    image: linuxserver/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    networks:
      - esir-net
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "${SYNCTHING_HTTP_PORT:-8384}:8384"
      - "${SYNCTHING_SYNC_TCP_PORT:-22000}:22000"
      - "${SYNCTHING_DISCOVERY_UDP_PORT:-21027}:21027/udp"
    volumes:
      - ./config:/var/syncthing/config
      - ./data:/var/syncthing/data

networks:
  esir-net:
    driver: bridge
