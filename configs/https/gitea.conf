server { 
   listen 80;
   server_name gitea.tpdocker.istic.univ-rennes1.fr;

location ^~ /.well-known/acme-challenge/ {
	auth_basic off;
        root /home/kbehi/certif/acme;
        try_files $uri =404;
    }

    #auth_basic "Accès réservé";
    #auth_basic_user_file /etc/nginx/.htpasswd;
location / {
        return 301 https://$host$request_uri;
    }


}

# HTTPS : reverse proxy vers le conteneur Docker
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gitea.tpdocker.istic.univ-rennes1.fr;

    ssl_certificate     /home/kbehi/certif/acme/tpdocker.istic.univ-rennes1.fr_ecc/fullchain.cer;
    ssl_certificate_key /home/kbehi/certif/acme/tpdocker.istic.univ-rennes1.fr_ecc/tpdocker.istic.univ-rennes1.fr.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://148.60.11.91:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

	client_max_body_size 500M;

    }
}

