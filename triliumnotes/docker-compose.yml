services:
  trilium:
    image: zadam/trilium:latest
    container_name: trilium
    restart: unless-stopped
    networks:
      - esir-net
    ports:
      - "${TRILIUM_HTTP_PORT:-8180}:8080"
    volumes:
      - ./data:/home/node/trilium-data
    environment:
      - APP_BASE_URL=http://triliumnotes.${DOMAIN_BASE}

networks:
  esir-net:
    driver: bridge

