---
- name: Deployer tous les services Docker
  hosts: docker_hosts
  become: true

  pre_tasks:
    - name: Verifier si docker est present
      ansible.builtin.command: docker --version
      register: docker_check
      ignore_errors: true

    - name: Echouer si Docker est absent
      ansible.builtin.fail:
        msg: "Docker n'est pas installé sur la VM."
      when: docker_check.rc != 0

    - name: Verifier si docker compose v2 est present
      ansible.builtin.command: docker compose version
      register: docker_compose_check
      ignore_errors: true

    - name: Echouer si docker compose v2 est absent
      ansible.builtin.fail:
        msg: "Docker Compose v2 (commande 'docker compose') n'est pas disponible sur la VM."
      when: docker_compose_check.rc != 0

- import_playbook: playbooks_ansible/wikijs.yml
- import_playbook: playbooks_ansible/gitea.yml
- import_playbook: playbooks_ansible/vaultwarden.yml
- import_playbook: playbooks_ansible/nextcloud.yml
- import_playbook: playbooks_ansible/wordpress.yml
- import_playbook: playbooks_ansible/mattermost.yml
- import_playbook: playbooks_ansible/monitoring.yml
- import_playbook: playbooks_ansible/syncthing.yml
- import_playbook: playbooks_ansible/triliumnotes.yml
- import_playbook: playbooks_ansible/loadtesting.yml

