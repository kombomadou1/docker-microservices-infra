services:
  taiga-back:
    image: taigaio/taiga-back:latest
    container_name: taiga-back
    restart: always
    environment:
      - TAIGA_SECRET_KEY=supersecretkey
      - TAIGA_DB_NAME=taiga
      - TAIGA_DB_USER=taiga
      - TAIGA_DB_PASSWORD=taiga
      - TAIGA_DB_HOST=db
    depends_on:
      - db
    ports:
      - "8000:8000"

  db:
    image: postgres:13
    container_name: taiga-db
    restart: always
    environment:
      - POSTGRES_DB=taiga
      - POSTGRES_USER=taiga
      - POSTGRES_PASSWORD=taiga
    volumes:
      - taiga_pgdata:/var/lib/postgresql/data

  taiga-front:
    image: taigaio/taiga-front:latest
    container_name: taiga-front
    restart: always
    environment:
      - TAIGA_BACK_URL=http://taiga-back:8000
    ports:
      - "8082:80"
    depends_on:
      - taiga-back

volumes:
  taiga_pgdata:
