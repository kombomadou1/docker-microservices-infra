services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: "mydockerpass404"
      DOMAIN: "https://vaultwarden.${DOMAIN_BASE}"
      WEBSOCKET_ENABLED: true
      SIGNUPS_ALLOWED: "true"
    volumes:
      - vw-data:/data
    ports:
      - "${VAULTWARDEN_HTTP_PORT:-4044}:80"

volumes:
  vw-data:

