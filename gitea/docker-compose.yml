services:
  db:
    image: postgres:15-alpine
    container_name: gitea_db
    restart: unless-stopped
    networks:
      - esir-net
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=gitea_password
      - POSTGRES_DB=giteadb
    volumes:
      - ./db:/var/lib/postgresql/data

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - esir-net
    ports:
      - "${GITEA_HTTP_PORT:-8083}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - ./data:/data
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
      - GITEA__service__DISABLE_REGISTRATION=true
      - DB_TYPE=postgres
      - DB_HOST=db:5432
      - DB_NAME=giteadb
      - DB_USER=gitea
      - DB_PASSWD=gitea_password
      - GITEA__server__DOMAIN=gitea.${DOMAIN_BASE}
      - GITEA__server__ROOT_URL=http://gitea.${DOMAIN_BASE}/
      - GITEA__server__HTTP_PORT=3000

networks:
  esir-net:
    external: true

