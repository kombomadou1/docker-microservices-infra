services:
  joplin-db:
    image: postgres:15
    container_name: joplin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: joplinpass
      POSTGRES_DB: joplin
    volumes:
      - ./db:/var/lib/postgresql/data
    networks:
      - esir-net

  joplin-server:
    image: joplin/server:latest
    container_name: joplin-server
    restart: unless-stopped
    depends_on:
      - joplin-db
    environment:
      - APP_PORT=22300
      - APP_BASE_URL=http://joplin.tpdocker.istic.univ-rennes1.fr
      - DB_CLIENT=pg
      - POSTGRES_PASSWORD=joplinpass
      - POSTGRES_DATABASE=joplin
      - POSTGRES_USER=joplin
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=joplin-db
      - MAILER_ENABLED=0
    ports:
      - "22300:22300"
    volumes:
      - ./data:/var/lib/joplin
    networks:
      - esir-net

networks:
  esir-net:
    external: true

